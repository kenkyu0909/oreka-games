name: Publish smartphone game

# 公開は手動実行のみ。既定は「非公開のお知らせ」を公開し、ゲームを公開したい
# ときだけ mode=app を選んで実行します（誤って公開してしまうのを防ぐため）。
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "公開する内容"
        type: choice
        options: [placeholder, app]
        default: placeholder

permissions:
  contents: read
  pages: read
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - if: inputs.mode == 'app'
        run: npm ci
      - if: inputs.mode == 'app'
        run: npm test
      - if: inputs.mode == 'app'
        run: npm run build:pages
      - if: inputs.mode == 'app'
        run: npx playwright install --with-deps chromium
      - if: inputs.mode == 'app'
        run: npm run test:pages
      - if: inputs.mode != 'app'
        run: node scripts/build-pages-placeholder.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish site
        id: deployment
        uses: actions/deploy-pages@v4
